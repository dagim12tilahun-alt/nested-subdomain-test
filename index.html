<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Subdomain Test</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        h1 { color: #58a6ff; font-size: 1.8rem; margin-bottom: 16px; }
        p { color: #8b949e; font-size: 1rem; line-height: 1.6; margin-bottom: 24px; }
        .badge {
            display: inline-block;
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 8px 16px;
            font-family: monospace;
            font-size: 0.9rem;
            color: #7ee787;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Subdomain Active & Online</h1>
        <p>Your multi-level nested subdomain configuration has successfully routed traffic to GitHub Pages.</p>
        <div class="badge">example.examplesubdomain1.examplesubdomain2.track-your.lol</div>
    </div>
</body>
</html>
